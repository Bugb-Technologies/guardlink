name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned to 24 because its bundled npm 11.x already satisfies the
          # >=11.5.1 requirement for OIDC trusted publishing, so no global
          # npm upgrade is needed here. Do not add one: `npm install -g
          # npm@latest` corrupts npm's own node_modules mid-upgrade and is
          # what broke the v1.4.2 release (MODULE_NOT_FOUND on promise-retry).
          # Node 22 would need that upgrade; 24 is how we avoid it.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm with OIDC trusted publishing
        run: npm publish --provenance --access public
